# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Jorge Kamassury'
    description: 'PhD em Eng. Elétrica (UFSC) e Pesquisador em IA/ML no ISI-SE.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Jorge Kamassury'
    
# Site footer (links exibidos)
footer:
  copyright:
    notice: '© {year} Jorge Kamassury. Este site está licenciado sob {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: "2 Jan 2006"     # formato PT-BR amigável
  time_format: "15:04"

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
